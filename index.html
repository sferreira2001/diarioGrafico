<script>
/* =========================================================
   CONFIGURAÇÃO: tudo o que se altera com frequência está aqui
   (textos, cores, fontes, tamanhos e velocidades das animações)
   ========================================================= */
const CONFIG = {
  supabase: {
    url: "https://xvpgktwxrbutclvtkqmo.supabase.co",
    chave: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cGdrdHd4cmJ1dGNsdnRrcW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDU5NTksImV4cCI6MjEwNzQ4MTk1OX0.srXAspWzaD59F20-mXiNHOBiidDo7OHYb0Vfz5Rbw60",
    tabela: "estrelas",
    colunaOrdem: "ordem"   /* coluna numérica que define a ordem da lista (1, 2, 3…) */
  },

  /* id da entrada do Supabase que o botão "about us" abre */
  sobreId: 1,

  /* Página "contact us": uma linha por contacto (apaga ou acrescenta linhas à vontade).
     Deixa "url" vazio para mostrar só texto, sem link. */
  contactos: [
    { rotulo: "email",     texto: "ola@exemplo.pt",   url: "mailto:ola@exemplo.pt" },
    { rotulo: "telefone",  texto: "+351 000 000 000", url: "tel:+351000000000" },
    { rotulo: "instagram", texto: "@o-teu-perfil",    url: "https://instagram.com/o-teu-perfil" },
    { rotulo: "morada",    texto: "Lisboa, Portugal", url: "" }
  ],

  /* Textos visíveis no site */
  textos: {
    tituloSite: "quadrados",
    dica: "touch the squares",
    botaoLista: "lista",
    botaoSobre: "about us",
    botaoContacto: "contact us",
    contactoTitulo: "contact us",
    listaTitulo: "todos os trabalhos",
    listaFechar: "← fechar",
    creditos: "website by Blow a Fuse",
    carregar: "a carregar quadrados…",
    semEstrelas: "ainda não há estrelas. adiciona linhas à tabela no Supabase.",
    erro: "não foi possível carregar as estrelas. verifica o URL, a chave e as permissões (RLS) da tabela.",
    abrirRato: "clica para abrir →",
    abrirToque: "toca outra vez para abrir →",
    voltar: "← voltar",
    voltarFim: "← voltar ao céu",
    obraNaoEncontrada: "obra não encontrada"
  },

  cores: { fundo: "#16130f", papel: "#efe7d4", vermelho: "#e0362b", amarelo: "#f2b705", azul: "#1d4ea0" },

  /* Para trocar de fonte, muda também o <link> do Google Fonts mais abaixo */
  fontes: {
    titulos: '"Jost", "Futura", "Century Gothic", system-ui, sans-serif',
    corpo: '"Jost", "Futura", "Century Gothic", system-ui, sans-serif'
  },

  tamanhos: {
    quadradoMin: 44,      /* px, menor tamanho possível de um quadrado */
    quadradoMax: 120,     /* px, maior tamanho possível */
    enchimento: 0.5,      /* 0–1: quanto do ecrã a pilha ocupa (menor = pilha mais baixa) */
    cartaoLargura: 300    /* px, cartão de hover */
  },

  velocidades: {
    gravidade: 2600,          /* px/s², queda dos quadrados */
    intervaloQueda: 150,      /* ms entre o início da queda de cada quadrado */
    quadrado: ".25s",         /* quadrado a ganhar sombra ao passar o rato */
    cartao: ".3s",            /* cartão a aparecer */
    disco: ".5s",             /* quadrado de transição a encolher */
    discoCobrir: ".7s",       /* quadrado de transição a cobrir o ecrã */
    lista: ".2s",             /* linhas da lista */
    cor: ".5s"
  },

  grao: 0                  /* 0 = sem grão, 1 = muito grão */
};

(function () {
  const c = CONFIG, v = c.velocidades, r = document.documentElement.style;
  const mapa = {
    "--preto": c.cores.fundo, "--branco": c.cores.papel,
    "--vermelho": c.cores.vermelho, "--amarelo": c.cores.amarelo, "--azul": c.cores.azul,
    "--display": c.fontes.titulos, "--corpo": c.fontes.corpo,
    "--cartao-largura": c.tamanhos.cartaoLargura + "px",
    "--vel-quadrado": v.quadrado, "--vel-cartao": v.cartao, "--vel-disco": v.disco,
    "--vel-cobrir": v.discoCobrir, "--vel-lista": v.lista, "--vel-cor": v.cor, "--grao": c.grao
  };
  for (const k in mapa) r.setProperty(k, mapa[k]);
  document.title = c.textos.tituloSite;
})();
const emMs = t => (/ms$/.test(t) ? parseFloat(t) : parseFloat(t) * 1000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  /* Cores, fontes, tamanhos e velocidades vêm do CONFIG, no topo do ficheiro. */

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--preto);
    color: var(--branco);
    font-family: var(--corpo);
    overflow: hidden;
  }

  /* ===== Bauhaus: papel, tinta e três cores primárias ===== */
  #cena {
    position: fixed; inset: 0;
    background: var(--branco);
    background-image: linear-gradient(rgba(0,0,0,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--preto);
    isolation: isolate;
    overflow: hidden;
  }
  #deco i { position: absolute; display: block; border: 3px solid var(--preto); }
  #deco .d1 { width: 38vmin; height: 38vmin; border-radius: 50%; background: var(--amarelo); top: -8vmin; right: 6vw; }
  #deco .d2 { width: 9vmin; height: 64vmin; background: var(--azul); top: 0; left: 8vw; }
  #ceu { position: absolute; inset: 0; z-index: 2; }

  .quadrado {
    position: absolute; left: 0; top: 0;
    padding: 0; cursor: pointer;
    background: var(--c, var(--amarelo));
    border: 3px solid var(--preto);
    border-radius: 0;
    pointer-events: none;
    transition: box-shadow var(--vel-quadrado) ease, scale var(--vel-quadrado) ease, opacity var(--vel-quadrado) ease;
  }
  .quadrado.pousou { pointer-events: auto; }
  .quadrado::before { content: ""; position: absolute; background: var(--d, var(--preto)); }
  .quadrado[data-motivo="0"]::before { inset: 20%; border-radius: 50%; }
  .quadrado[data-motivo="1"]::before { left: 20%; width: 60%; bottom: 0; height: 32%; border-radius: 999px 999px 0 0; }
  .quadrado[data-motivo="2"]::before { inset: 0; background: linear-gradient(135deg, transparent 50%, var(--d) 50%); }
  .quadrado[data-motivo="3"]::before { top: 12%; left: 12%; width: 34%; height: 34%; }
  .quadrado:hover, .quadrado.ativa, .quadrado:focus-visible { scale: 1.07; box-shadow: 6px 6px 0 var(--preto); z-index: 3; outline: none; }
  body.sobre .quadrado:not(.ativa) { opacity: .45; }

  /* Barra de baixo: o chão onde os quadrados pousam */
  #barra {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 22px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    background: var(--preto); color: var(--branco);
    z-index: 5;
  }
  #barra p { margin: 0; font-size: 1.05rem; font-weight: 500; text-transform: lowercase; }
  #dica { justify-self: start; }
  #creditos { justify-self: end; }
  #botoes { justify-self: center; display: flex; gap: 12px; }
  #botoes button {
    width: 76px; height: 76px; padding: 6px;
    display: grid; place-items: center; text-align: center;
    font-family: var(--display); font-weight: 800; font-size: .85rem; line-height: 1.05; text-transform: lowercase;
    color: var(--preto); border: 3px solid var(--branco); border-radius: 0; cursor: pointer;
    transition: translate var(--vel-quadrado) ease, box-shadow var(--vel-quadrado) ease;
  }
  #btn-lista { background: var(--vermelho); color: var(--branco) !important; }
  #btn-sobre { background: var(--amarelo); }
  #btn-contacto { background: var(--azul); color: var(--branco) !important; }
  #botoes button:hover, #botoes button:focus-visible { translate: 0 -6px; box-shadow: 5px 5px 0 var(--branco); outline: none; }
  @media (max-width: 900px) {
    #barra { grid-template-columns: 1fr; justify-items: center; gap: 10px; }
    #dica { order: -1; justify-self: center; font-size: .95rem; }
    #creditos { justify-self: center; font-size: .85rem; }
    #botoes button { width: 64px; height: 64px; font-size: .75rem; }
  }

  /* Quadrado de transição: cresce a partir do que foi clicado até cobrir o ecrã */
  #disco {
    position: absolute; left: 0; top: 0;
    width: 100px; height: 100px; margin: -50px 0 0 -50px;
    background: var(--amarelo);
    transform: translate(var(--px, 0px), var(--py, 0px)) scale(0);
    transition: transform var(--vel-disco) cubic-bezier(.2, .8, .2, 1);
    pointer-events: none; z-index: 7;
  }
  #disco.aberto { transform: translate(var(--px, 0px), var(--py, 0px)) scale(var(--k, 1)); }
  #disco.cobre { transition-duration: var(--vel-cobrir); }

  #estado { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); text-align: center; font-weight: 800; font-size: 1.3rem; max-width: 30ch; z-index: 4; text-transform: lowercase; }
  #estado[hidden] { display: none; }

  /* Cartão de pré-visualização */
  #cartao {
    position: fixed; top: 0; left: 0;
    width: min(var(--cartao-largura), calc(100vw - 24px));
    background: var(--branco); color: var(--preto);
    border: 3px solid var(--preto); box-shadow: 8px 8px 0 var(--vermelho);
    pointer-events: none; z-index: 10;
    opacity: 0; translate: 0 8px;
    transition: opacity var(--vel-cartao) ease, translate var(--vel-cartao) ease;
  }
  #cartao.visivel { opacity: 1; translate: 0 0; }
  #cartao .foto { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--preto); border-bottom: 3px solid var(--preto); }
  #cartao .foto[hidden], #cartao .foto > [hidden] { display: none; }
  #cartao img, #cartao video { display: block; width: 100%; height: 100%; object-fit: cover; }
  #cartao .corpo { padding: 14px 16px 18px; }
  #cartao h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: .95; letter-spacing: -0.03em; text-transform: lowercase; overflow-wrap: anywhere; }
  #cartao p { margin: 0; font-size: 1.05rem; line-height: 1.4; }
  #cartao .abrir { display: block; margin-top: 12px; font-family: var(--display); font-weight: 800; font-size: .8rem; }
  #cartao .abrir .toque { display: none; }
  @media (hover: none) { #cartao .abrir .rato { display: none; } #cartao .abrir .toque { display: inline; } }

  /* =======================================================
     PÁGINA DA OBRA (o lado "invertido": fundo branco)
     ======================================================= */
  #obra {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--branco);
    color: var(--preto);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0 clamp(16px, 3vw, 40px) 8vh;
  }
  #obra[hidden] { display: none; }

  #voltar, #fechar-lista, #fechar-contacto {
    position: fixed;
    cursor: pointer;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: clamp(16px, 3vw, 40px);
    z-index: 2;
    background: var(--preto);
    color: var(--branco);
    font-family: var(--display);
    font-weight: 700;
    font-size: .95rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    padding: 10px 14px;
    border: 1px solid var(--preto);
  }
  #voltar:hover, #fechar-lista:hover, #fechar-contacto:hover { background: var(--branco); color: var(--preto); }
  #voltar:focus-visible, #fechar-lista:focus-visible, #fechar-contacto:focus-visible { outline: 2px solid var(--preto); outline-offset: 3px; }

  #obra h1 {
    margin: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 88px);
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(3.4rem, 15vw, 14rem);
    line-height: .82;
    letter-spacing: -0.055em;
    overflow-wrap: anywhere;
  }

  /* Topo: o título emparelhado com a imagem principal */
  .hero { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; align-items: start; margin-bottom: 16vh; }
  .hero h1 { grid-column: 1 / -1; grid-row: 1; }
  .hero.com-img h1 { grid-column: 1 / 8; }
  #obra .hero.com-img h1 { font-size: clamp(3rem, 10vw, 10rem); }
  .hero figure { grid-column: 8 / 13; grid-row: 1; margin: calc(env(safe-area-inset-top, 0px) + 88px) 0 0; }

  /* Blocos: texto (com o subtítulo imediatamente por cima) e imagem lado a lado;
     o lado troca a cada bloco. Todos os textos e subtítulos têm o mesmo peso. */
  .galeria { display: flex; flex-direction: column; gap: 16vh; }
  .linha { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
  .linha figure { margin: 0; grid-column: var(--c, 1 / -1); grid-row: 1; }
  .linha .txt { grid-column: var(--t, 3 / 11); grid-row: 1; align-self: center; }
  .txt .sub {
    margin: 0 0 10px;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.3rem, 2.2vw, 1.9rem);
    line-height: 1;
    letter-spacing: -0.03em;
    white-space: pre-line;
  }
  .linha figure.centro figcaption { text-align: center; }
  .linha figure.centro .m.vertical { margin-inline: auto; }
  .txt p {
    margin: 0;
    white-space: pre-line;
    font-style: italic;
    font-size: clamp(1.25rem, 1.9vw, 1.65rem);
    line-height: 1.3;
  }
  #obra .m { position: relative; background: var(--preto); }
  #obra .m img,
  #obra .m video { display: block; width: 100%; height: auto; }
  #obra .m iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  #obra .m.vertical { max-width: min(100%, 380px); }
  #obra .m.vertical iframe { aspect-ratio: 9 / 16; }
  #obra figcaption {
    margin-top: 10px;
    font-style: italic;
    font-size: 1.05rem;
  }

  /* Em ecrãs com rato, as imagens ficam a preto e branco e ganham cor ao passar */
  @media (hover: hover) {
    #obra .m { filter: grayscale(1) contrast(1.15); transition: filter var(--vel-cor) ease; }
    #obra figure:hover .m { filter: none; }
  }

  .fim {
    display: block;
    margin-top: 16vh;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 8rem);
    line-height: .9;
    letter-spacing: -0.05em;
    color: var(--preto);
    text-decoration: none;
  }
  .fim:hover { color: transparent; -webkit-text-stroke: 1px var(--preto); }

  @media (max-width: 760px) {
    #obra .hero.com-img h1 { font-size: clamp(3.4rem, 15vw, 14rem); }
    .hero.com-img h1, .hero h1, .hero figure, .linha figure, .linha .txt { grid-column: 1 / -1; grid-row: auto; }
    .hero figure { margin-top: 0; }
    .hero, .linha { gap: 18px; }
    .hero { margin-bottom: 10vh; }
    .galeria { gap: 10vh; }
  }

  /* Lista simplificada de todos os trabalhos */
  #lista, #contacto {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--branco);
    color: var(--preto);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 84px) clamp(16px, 3vw, 40px) 12vh;
  }
  #lista[hidden], #contacto[hidden] { display: none; }
  #lista h2, #contacto h2 { margin: 0 0 4vh; font-weight: 400; font-style: italic; font-size: 1.25rem; }
  #lista ol, #contacto ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--preto); }
  #lista a, #contacto a, #contacto .sem-link {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 10px 0 12px;
    border-bottom: 1px solid var(--preto);
    color: inherit;
    text-decoration: none;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.8rem, 6vw, 4.5rem);
    line-height: .95;
    letter-spacing: -0.045em;
    overflow-wrap: anywhere;
    transition: padding var(--vel-lista) ease, background var(--vel-lista) ease, color var(--vel-lista) ease;
  }
  #lista a:hover, #lista a:focus-visible, #contacto a:hover, #contacto a:focus-visible { background: var(--preto); color: var(--branco); padding-left: 16px; outline: none; }
  #lista .n, #contacto .n { min-width: 2.5ch; font-family: var(--corpo); font-style: italic; font-weight: 400; font-size: 1.1rem; letter-spacing: 0; }

  #contacto .n { min-width: 9ch; }
  #contacto a, #contacto .sem-link { font-size: clamp(1.5rem, 4.6vw, 3.4rem); }

  /* Grão de película por cima de tudo */
  #grao {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    opacity: var(--grao);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #estado {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-style: italic;
    font-size: 1.3rem;
    max-width: 30ch;
    z-index: 4;
  }
  #estado[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #astrolabio { animation: none; }
    .estrela::before, #disco, #cartao { transition: none; }
  }

  /* ===== Bauhaus nas páginas: minúsculas, sem itálicos, linhas grossas, cor ===== */
  #obra *, #lista *, #contacto * { font-style: normal !important; }
  #obra h1, #obra .sub, #lista h2, #contacto h2, #lista a, #contacto a, #contacto .sem-link,
  #voltar, #fechar-lista, #fechar-contacto { text-transform: lowercase; }
  #voltar, #fechar-lista, #fechar-contacto {
    background: var(--amarelo); color: var(--preto);
    border: 3px solid var(--preto); border-radius: 0; box-shadow: 4px 4px 0 var(--preto);
  }
  #voltar:hover, #fechar-lista:hover, #fechar-contacto:hover,
  #voltar:focus-visible, #fechar-lista:focus-visible, #fechar-contacto:focus-visible { background: var(--vermelho); color: var(--branco); }
  #obra figure .m { filter: none !important; border: 3px solid var(--preto); }
  .txt .sub::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .4em; background: var(--vermelho); }
  .linha:nth-child(2) .sub::before { background: var(--azul); }
  .linha:nth-child(3) .sub::before { background: var(--amarelo); }
  #lista ol, #contacto ul { border-top-width: 3px; }
  #lista a, #contacto a, #contacto .sem-link { border-bottom-width: 3px; }
  #lista li:nth-child(3n+1) a:hover, #lista li:nth-child(3n+1) a:focus-visible, #contacto li:nth-child(3n+1) a:hover { background: var(--vermelho); color: var(--branco); }
  #lista li:nth-child(3n+2) a:hover, #lista li:nth-child(3n+2) a:focus-visible, #contacto li:nth-child(3n+2) a:hover { background: var(--amarelo); color: var(--preto); }
  #lista li:nth-child(3n) a:hover, #lista li:nth-child(3n) a:focus-visible, #contacto li:nth-child(3n) a:hover { background: var(--azul); color: var(--branco); }
</style>
</head>
<body>

<div id="cena">
  <div id="deco" aria-hidden="true"><i class="d1"></i><i class="d2"></i></div>
  <main id="ceu" aria-label="Trabalhos"></main>
  <div id="disco"></div>
  <div id="estado" role="status" data-t="carregar"></div>

  <div id="barra">
    <p id="dica" data-t="dica"></p>
    <div id="botoes">
      <button id="btn-lista" type="button" data-t="botaoLista"></button>
      <button id="btn-sobre" type="button" data-t="botaoSobre"></button>
      <button id="btn-contacto" type="button" data-t="botaoContacto"></button>
    </div>
    <p id="creditos" data-t="creditos"></p>
  </div>
</div>

<article id="cartao" aria-hidden="true">
  <div class="foto" hidden>
    <img alt="" hidden>
    <video muted loop playsinline hidden></video>
  </div>
  <div class="corpo">
    <h2></h2>
    <p></p>
    <span class="abrir"><span class="rato" data-t="abrirRato"></span><span class="toque" data-t="abrirToque"></span></span>
  </div>
</article>

<section id="lista" aria-label="Lista de trabalhos" hidden>
  <button id="fechar-lista" type="button" data-t="listaFechar"></button>
  <h2 data-t="listaTitulo"></h2>
  <ol></ol>
</section>

<section id="contacto" aria-label="Contactos" hidden>
  <button id="fechar-contacto" type="button" data-t="listaFechar"></button>
  <h2 data-t="contactoTitulo"></h2>
  <ul></ul>
</section>

<section id="obra" aria-label="Obra" hidden>
  <a id="voltar" href="#/" data-voltar data-t="voltar"></a>
  <div id="obra-conteudo"></div>
</section>

<div id="grao"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   1. CONFIGURAÇÃO DO SUPABASE
   Tabela "estrelas" com as colunas:
     id, titulo, subtitulo_1, subtitulo_2, descricao, descricao_2, descricao_3,
     imagem_url, media_1 … media_5   (imagens, vídeos .mp4/.webm ou links do YouTube)
     x, y (0–100, opcional), tamanho (px, opcional)
   ========================================================= */
const SUPABASE_URL = CONFIG.supabase.url;
const SUPABASE_ANON_KEY = CONFIG.supabase.chave;
const TABELA = CONFIG.supabase.tabela;
const TITULO_SITE = CONFIG.textos.tituloSite;

/* Dados de exemplo, usados enquanto o Supabase não estiver configurado. */
function imagemExemplo(n) {
  let aneis = "";
  for (let i = 1; i <= 7; i++) {
    aneis += `<circle cx="${60 + n * 35}" cy="${70 + n * 12}" r="${i * 22 + n * 4}" fill="none" stroke="#fff" stroke-width="${i % 2 ? 2 : 6}" opacity="${0.9 - i * 0.1}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><defs><radialGradient id="g" cx="${25 + n * 8}%" cy="35%" r="90%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#222"/></radialGradient></defs><rect width="320" height="240" fill="url(#g)"/>${aneis}</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const EXEMPLO = [
  { id: 1, titulo: "sirius", descricao: "A mais brilhante do céu noturno, a cerca de 8,6 anos-luz.", descricao_2: "Segunda descrição de exemplo.", media_1: imagemExemplo(2), imagem_url: imagemExemplo(1) },
  { id: 2, titulo: "vega", descricao: "Já foi a estrela polar e voltará a sê-lo daqui a milhares de anos.", imagem_url: imagemExemplo(2) },
  { id: 3, titulo: "betelgeuse", descricao: "Uma supergigante vermelha no ombro de Orionte.", imagem_url: imagemExemplo(3) }
];

/* =========================================================
   2. CARREGAR AS ESTRELAS
   ========================================================= */
const configurado = !SUPABASE_URL.includes("O-TEU-PROJETO");
const ceu = document.getElementById("ceu");
const cena = document.getElementById("cena");
const estado = document.getElementById("estado");
let ESTRELAS = [];
let carregado = false;

async function carregarEstrelas() {
  if (!configurado) {
    estado.hidden = true;
    return EXEMPLO;
  }
  try {
    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    /* ordem: pela coluna "ordem" (vazias no fim) e, em empate, por id */
    let { data, error } = await cliente.from(TABELA).select("*")
      .order(CONFIG.supabase.colunaOrdem, { ascending: true, nullsFirst: false })
      .order("id", { ascending: true });
    if (error) {   /* ex.: a coluna ainda não existe: lê por id para o site não ficar vazio */
      console.warn("Sem ordenação pela coluna '" + CONFIG.supabase.colunaOrdem + "':", error.message);
      ({ data, error } = await cliente.from(TABELA).select("*").order("id", { ascending: true }));
    }
    if (error) throw error;
    if (!data || !data.length) {
      estado.textContent = CONFIG.textos.semEstrelas;
      return [];
    }
    estado.hidden = true;
    return data;
  } catch (err) {
    console.error("Erro ao ler o Supabase:", err);
    estado.textContent = CONFIG.textos.erro;
    return [];
  }
}

/* =========================================================
   3. MEDIA: imagens, vídeos e YouTube
   ========================================================= */
function listaMedia(d) {
  return [d.imagem_url, d.media_1, d.media_2, d.media_3, d.media_4, d.media_5]
    .map(v => (v == null ? "" : String(v).trim()))
    .filter(Boolean);
}

function urlSegura(url) {
  return /^https?:\/\//i.test(url) || /^data:image\//i.test(url);
}

/* Reconhece youtube.com/watch, youtu.be, /shorts, /embed, /live */
function youtube(url) {
  let u;
  try { u = new URL(url); } catch { return null; }
  const host = u.hostname.replace(/^(www\.|m\.|music\.)/, "");
  let id = null, shorts = false;
  if (host === "youtu.be") {
    id = u.pathname.slice(1).split("/")[0];
  } else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    if (u.pathname === "/watch") id = u.searchParams.get("v");
    else {
      const p = u.pathname.split("/").filter(Boolean);
      if (["shorts", "embed", "live", "v"].includes(p[0])) { id = p[1]; shorts = p[0] === "shorts"; }
    }
  } else return null;
  if (!id || !/^[\w-]{11}$/.test(id)) return null;

  /* instante de início: ?t=90 ou ?t=1m30s */
  const t = u.searchParams.get("t") || u.searchParams.get("start") || "";
  let start = 0;
  if (/^\d+$/.test(t)) start = +t;
  else {
    const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (m) start = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  }
  return { id, shorts, start };
}

function ehVideoFicheiro(url) {
  try { return /\.(mp4|webm|mov|m4v|ogv)$/i.test(new URL(url).pathname); }
  catch { return false; }
}

/* Primeira media serve de capa no cartão */
function capa(d) {
  const m = listaMedia(d)[0];
  if (!m) return null;
  const yt = youtube(m);
  if (yt) return { tipo: "img", src: `https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg` };
  if (!urlSegura(m)) return null;
  return { tipo: ehVideoFicheiro(m) ? "video" : "img", src: m };
}

/* =========================================================
   4. QUADRADOS QUE CAEM E FICAM EMPILHADOS
   Cada trabalho é um quadrado: cai um a um e pousa em cima do que já lá está.
   Se a linha tiver x (0–100), define onde o quadrado cai; y não é usado.
   ========================================================= */
const frac = n => n - Math.floor(n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduzirMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
const barra = document.getElementById("barra");
const PAR = [["--vermelho", "--preto"], ["--amarelo", "--azul"], ["--azul", "--amarelo"], ["--preto", "--vermelho"], ["--branco", "--azul"]];
let Q = [], animacao = 0, listaAtual = [];

const chao = () => window.innerHeight - barra.offsetHeight;

function tamanhos(n) {
  const T = CONFIG.tamanhos;
  const f = Array.from({ length: n }, (_, i) => 0.78 + 0.44 * frac(0.3 + i * 0.618));
  const soma = f.reduce((a, v) => a + v * v, 0) || 1;
  const base = clamp(Math.sqrt(T.enchimento * window.innerWidth * chao() / soma), T.quadradoMin, T.quadradoMax);
  return f.map(v => Math.round(base * v));
}

/* topo onde o quadrado q assenta: o chão ou o quadrado mais alto por baixo dele */
function assenta(q, pousados) {
  let base = chao();
  for (const o of pousados) if (q.x < o.x + o.s && q.x + q.s > o.x) base = Math.min(base, o.y);
  return base - q.s;
}

const pintar = q => { q.el.style.transform = `translate(${q.x}px, ${q.y}px) rotate(${q.rot}deg)`; };

function ligar(b) {
  b.addEventListener("pointerenter", ev => { if (ev.pointerType === "mouse") mostrar(b); });
  b.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") esconder(b); });
  b.addEventListener("focus", () => { if (b.matches(":focus-visible")) mostrar(b); });
  b.addEventListener("blur", () => esconder(b));
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    const toque = ev.pointerType === "touch" || ev.pointerType === "pen";
    /* toque: 1.º toque mostra o cartão, 2.º abre a obra. Rato/teclado: abre logo. */
    if (toque && !b.classList.contains("ativa")) mostrar(b);
    else entrar(b);
  });
}

function desenhar(lista, instante) {
  cancelAnimationFrame(animacao);
  listaAtual = lista;
  ceu.replaceChildren();
  const T = tamanhos(lista.length);
  Q = lista.map((e, i) => {
    const b = document.createElement("button");
    const [fundo, motivo] = PAR[i % PAR.length];
    b.type = "button";
    b.className = "quadrado";
    b.dataset.motivo = i % 4;
    b.style.setProperty("--c", `var(${fundo})`);
    b.style.setProperty("--d", `var(${motivo})`);
    b.style.width = b.style.height = T[i] + "px";
    b.setAttribute("aria-label", e.titulo || "Trabalho");
    b._dados = e;
    ligar(b);
    ceu.appendChild(b);
    const rotF = (frac(i * 0.37 + 0.1) - 0.5) * 6;
    const q = { el: b, s: T[i], rotF, rot: rotF + (frac(i * 0.71) - 0.5) * 80, v: 0, y: -T[i] - 40, estado: "espera",
      xr: e.x != null ? clamp(e.x / 100, 0, 1) : frac(0.5 + (i + 1) * 0.7548776662) };
    q.x = Math.round(q.xr * (window.innerWidth - q.s));
    pintar(q);
    return q;
  });

  const pousados = [];
  if (instante || reduzirMovimento) {
    Q.forEach(q => { q.y = assenta(q, pousados); q.rot = q.rotF; q.estado = "pousou"; q.el.classList.add("pousou"); pousados.push(q); pintar(q); });
    return;
  }

  const intervalo = Math.min(CONFIG.velocidades.intervaloQueda, 3500 / Math.max(1, Q.length));
  const g = CONFIG.velocidades.gravidade;
  let t0 = null, ult = null;
  const passo = t => {
    if (t0 === null) { t0 = t; ult = t; }
    const dt = Math.min(0.033, (t - ult) / 1000);
    ult = t;
    let vivos = false;
    Q.forEach((q, i) => {
      if (q.estado === "pousou") return;
      vivos = true;
      if (t - t0 < i * intervalo) return;
      q.estado = "cai";
      q.v += g * dt;
      q.y += q.v * dt;
      q.rot += (q.rotF - q.rot) * Math.min(1, 5 * dt);
      const alvo = assenta(q, pousados);
      if (q.y >= alvo) {
        q.y = alvo;
        if (q.v > 300) q.v = -q.v * 0.25;   /* pequeno ressalto */
        else { q.v = 0; q.rot = q.rotF; q.estado = "pousou"; q.el.classList.add("pousou"); pousados.push(q); }
      }
      pintar(q);
    });
    if (vivos) animacao = requestAnimationFrame(passo);
  };
  animacao = requestAnimationFrame(passo);
}

/* =========================================================
   5. CARTÃO DE PRÉ-VISUALIZAÇÃO (ao passar o rato num quadrado)
   ========================================================= */
const cartao = document.getElementById("cartao");
const foto = cartao.querySelector(".foto");
const cImg = cartao.querySelector("img");
const cVid = cartao.querySelector("video");
const cTitulo = cartao.querySelector("h2");
const cDesc = cartao.querySelector("p");
const disco = document.getElementById("disco");
let atual = null;
let ultimaEstrela = null;

function mostrar(botao) {
  if (atual && atual !== botao) atual.classList.remove("ativa");
  atual = botao;
  botao.classList.add("ativa");
  document.body.classList.add("sobre");
  const d = botao._dados;

  cTitulo.textContent = d.titulo || "";
  cDesc.textContent = d.descricao || "";

  const c = capa(d);
  cImg.hidden = true;
  cVid.hidden = true;
  cVid.pause();
  if (c) {
    foto.hidden = false;
    if (c.tipo === "video") {
      cVid.src = c.src;
      cVid.hidden = false;
      cVid.play().catch(() => {});
    } else {
      cImg.src = c.src;
      cImg.alt = d.titulo || "";
      cImg.hidden = false;
    }
  } else {
    foto.hidden = true;
  }

  cartao.setAttribute("aria-hidden", "false");
  cartao.classList.add("visivel");
  posicionar(botao);
}

function esconder(botao) {
  if (atual !== botao) return;
  botao.classList.remove("ativa");
  atual = null;
  document.body.classList.remove("sobre");
  cartao.classList.remove("visivel");
  cartao.setAttribute("aria-hidden", "true");
  cVid.pause();
}

function posicionar(botao) {
  const m = 12;
  const r = botao.getBoundingClientRect();
  const w = cartao.offsetWidth, h = cartao.offsetHeight;
  const left = clamp(r.left + r.width / 2 - w / 2, m, window.innerWidth - w - m);
  let top = r.top - h - 14;
  if (top < m) top = r.bottom + 14;
  cartao.style.left = left + "px";
  cartao.style.top = clamp(top, m, window.innerHeight - h - m) + "px";
}

/* =========================================================
   6. ENTRAR NUMA PÁGINA: o quadrado clicado cresce até cobrir o ecrã
   ========================================================= */
let veioDoCeu = false;

function cobrir(origem, destino) {
  const r = origem.getBoundingClientRect();
  const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
  const W = window.innerWidth, H = window.innerHeight;
  const meia = Math.max(sx, W - sx, sy, H - sy);
  const cor = getComputedStyle(origem).backgroundColor;
  disco.style.background = /rgba\(.*,\s*0\)|transparent/.test(cor) ? "var(--amarelo)" : cor;
  disco.style.setProperty("--px", sx + "px");
  disco.style.setProperty("--py", sy + "px");
  disco.style.setProperty("--k", (2 * meia + 80) / 100);
  cena.inert = true;
  disco.classList.add("aberto", "cobre");
  veioDoCeu = true;
  setTimeout(() => { location.hash = destino; },
    reduzirMovimento ? 0 : Math.max(0, emMs(CONFIG.velocidades.discoCobrir) - 60));
}

function entrar(botao) {
  ultimaEstrela = botao;
  botao.classList.remove("ativa");
  atual = null;
  document.body.classList.remove("sobre");
  cartao.classList.remove("visivel");
  cartao.setAttribute("aria-hidden", "true");
  cVid.pause();
  cobrir(botao, "#/obra/" + encodeURIComponent(String(botao._dados.id)));
}

/* =========================================================
   7. PÁGINA DA OBRA
   ========================================================= */
const obra = document.getElementById("obra");
const obraConteudo = document.getElementById("obra-conteudo");
const linkVoltar = document.getElementById("voltar");

/* posições das imagens na grelha de 12 colunas (efeito assimétrico) */
const PADROES = ["1 / 9", "5 / 13", "2 / 10", "1 / 7", "6 / 13", "3 / 12"];

function el(tag, cls, texto) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (texto != null) n.textContent = texto;
  return n;
}

function criarFigura(url, i, total, titulo) {
  const fig = el("figure");
  fig.style.setProperty("--c", PADROES[i % PADROES.length]);
  const m = el("div", "m");
  const yt = youtube(url);

  if (yt) {
    if (yt.shorts) m.classList.add("vertical");
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&playsinline=1` + (yt.start ? `&start=${yt.start}` : "");
    f.title = `${titulo || "obra"} — vídeo ${i + 1}`;
    f.loading = "lazy";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
    m.append(f);
  } else if (!urlSegura(url)) {
    return null;
  } else if (ehVideoFicheiro(url)) {
    const v = document.createElement("video");
    v.src = url;
    v.controls = true;
    v.playsInline = true;
    v.preload = "metadata";
    m.append(v);
  } else {
    const img = document.createElement("img");
    img.src = url;
    img.alt = `${titulo || "obra"} — ${i + 1}`;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => { fig.hidden = true; };
    m.append(img);
  }

  fig.append(m, el("figcaption", "", `${i + 1} / ${total}`));
  return fig;
}

function mostrarObra(id) {
  const e = ESTRELAS.find(x => String(x.id) === id);
  obraConteudo.replaceChildren();

  if (!e) {
    obraConteudo.append(el("h1", "", CONFIG.textos.obraNaoEncontrada));
  } else {
    const limpo = v => (v == null ? "" : String(v).trim());
    const total = listaMedia(e).length;
    let n = 0;   /* numeração das legendas */
    const nova = u => { u = limpo(u); return u ? criarFigura(u, n++, total, e.titulo) : null; };
    const centrar = f => { f.classList.add("centro"); f.style.setProperty("--c", "3 / 11"); };

    /* topo: o título emparelhado com a imagem principal (imagem_url) */
    const hero = el("div", "hero");
    hero.append(el("h1", "", e.titulo || ""));
    const principal = nova(e.imagem_url);
    if (principal) { hero.classList.add("com-img"); hero.append(principal); }
    obraConteudo.append(hero);

    /* media_1 ↔ descrição · media_2 ↔ subtítulo 1 + descrição 2 · media_3 ↔ subtítulo 2 + descrição 3 */
    const pares = [
      { sub: "",             texto: e.descricao,   media: e.media_1 },
      { sub: e.subtitulo_1,   texto: e.descricao_2, media: e.media_2 },
      { sub: e.subtitulo_2,   texto: e.descricao_3, media: e.media_3 }
    ];
    const galeria = el("div", "galeria");
    let lado = 0;

    pares.forEach(p => {
      const sub = limpo(p.sub), texto = limpo(p.texto);
      const f = nova(p.media);
      if (!sub && !texto && !f) return;
      const linha = el("div", "linha");
      if (sub || texto) {
        const txt = el("div", "txt");
        if (sub) txt.append(el("h2", "sub", sub));
        if (texto) txt.append(el("p", "", texto));
        if (f) {
          const direita = lado++ % 2 === 1;   /* o lado troca a cada par */
          f.style.setProperty("--c", direita ? "6 / 13" : "1 / 8");
          txt.style.setProperty("--t", direita ? "1 / 5" : "9 / 13");
          linha.append(f, txt);
        } else {
          linha.append(txt);
        }
      } else {
        centrar(f);   /* imagem sem texto associado */
        linha.append(f);
      }
      galeria.append(linha);
    });

    /* media_4 e media_5 não têm texto: ficam centradas */
    [e.media_4, e.media_5].forEach(u => {
      const f = nova(u);
      if (!f) return;
      centrar(f);
      const linha = el("div", "linha");
      linha.append(f);
      galeria.append(linha);
    });
    if (galeria.children.length) obraConteudo.append(galeria);
  }

  const fim = el("a", "fim", CONFIG.textos.voltarFim);
  fim.href = "#/";
  fim.setAttribute("data-voltar", "");
  fim.addEventListener("click", aoVoltar);
  obraConteudo.append(fim);

  cena.inert = true;
  obra.hidden = false;
  obra.scrollTop = 0;
  document.title = (e && e.titulo ? e.titulo + " — " : "") + TITULO_SITE;
  linkVoltar.focus({ preventScroll: true });
}

function fecharObra(paraLista) {
  const estavaAberta = !obra.hidden;
  obra.hidden = true;
  obraConteudo.replaceChildren();   /* pára vídeos e iframes */
  cena.inert = false;
  document.title = TITULO_SITE;
  veioDoCeu = false;
  /* o disco encolhe de volta para a estrela */
  disco.classList.remove("cobre", "aberto");
  if (estavaAberta && !paraLista && ultimaEstrela && ultimaEstrela.isConnected) {
    ultimaEstrela.focus({ preventScroll: true });
    ultimaEstrela.blur();
  }
}

function voltar() {
  if (veioDoCeu) history.back();
  else location.hash = "#/";
}
function aoVoltar(ev) {
  ev.preventDefault();
  voltar();
}
linkVoltar.addEventListener("click", aoVoltar);

/* Rotas por hash: "#/" é o céu, "#/obra/ID" é a página da obra.
   Funciona em GitHub Pages porque não precisa de servidor. */
function rota() {
  const h = location.hash;
  const m = h.match(/^#\/obra\/(.+)$/);
  if (m) {
    if (!carregado) return;
    fecharLista();
    fecharContacto();
    mostrarObra(decodeURIComponent(m[1]));
  } else if (h === "#/lista") {
    if (!carregado) return;
    const veioDeObra = !obra.hidden;
    fecharContacto();
    fecharObra(true);
    if (veioDeObra) veioDoCeu = true;
    mostrarLista();
  } else if (h === "#/contacto") {
    fecharLista();
    fecharObra(true);
    mostrarContacto();
  } else {
    fecharLista();
    fecharContacto();
    fecharObra();
  }
}
window.addEventListener("hashchange", rota);

/* =========================================================
   8. EVENTOS GERAIS E ARRANQUE
   ========================================================= */
const painelLista = document.getElementById("lista");
const btnLista = document.getElementById("btn-lista");
const btnFechar = document.getElementById("fechar-lista");

/* A entrada do "about us" só abre pelo botão: não é estrela nem entra na lista */
const eSobre = e => String(e.id) === String(CONFIG.sobreId);

function construirLista() {
  const visiveis = ESTRELAS.filter(e => !eSobre(e));
  painelLista.querySelector("ol").replaceChildren(...visiveis.map((e, i) => {
    const li = document.createElement("li");
    const a = el("a");
    a.href = "#/obra/" + encodeURIComponent(String(e.id));
    a.append(el("span", "n", String(i + 1).padStart(2, "0")), el("span", "", e.titulo || ""));
    a.addEventListener("click", () => { veioDoCeu = true; });  /* "voltar" regressa à lista */
    li.append(a);
    return li;
  }));
}

function mostrarLista() {
  painelLista.hidden = false;
  painelLista.scrollTop = 0;
  cena.inert = true;
  document.title = CONFIG.textos.listaTitulo + " — " + TITULO_SITE;
  btnFechar.focus({ preventScroll: true });
}

function fecharLista() { painelLista.hidden = true; }

/* Página "contact us", gerada a partir de CONFIG.contactos */
const painelContacto = document.getElementById("contacto");
const btnContacto = document.getElementById("btn-contacto");
const btnFecharContacto = document.getElementById("fechar-contacto");

function construirContacto() {
  painelContacto.querySelector("ul").replaceChildren(...CONFIG.contactos.map(c => {
    const li = document.createElement("li");
    const partes = [el("span", "n", c.rotulo || ""), el("span", "", c.texto || "")];
    if (c.url) {
      const a = el("a");
      a.href = c.url;
      if (/^https?:/i.test(c.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      a.append(...partes);
      li.append(a);
    } else {
      const d = el("div", "sem-link");
      d.append(...partes);
      li.append(d);
    }
    return li;
  }));
}

function mostrarContacto() {
  painelContacto.hidden = false;
  painelContacto.scrollTop = 0;
  cena.inert = true;
  document.title = CONFIG.textos.contactoTitulo + " — " + TITULO_SITE;
  btnFecharContacto.focus({ preventScroll: true });
}

function fecharContacto() { painelContacto.hidden = true; }

btnLista.addEventListener("click", ev => {
  ev.stopPropagation();
  if (!carregado) return;
  if (atual) esconder(atual);
  cobrir(btnLista, "#/lista");
});
document.getElementById("btn-sobre").addEventListener("click", ev => {
  ev.stopPropagation();
  if (!carregado) return;
  if (atual) esconder(atual);
  cobrir(ev.currentTarget, "#/obra/" + encodeURIComponent(String(CONFIG.sobreId)));
});
btnContacto.addEventListener("click", ev => {
  ev.stopPropagation();
  if (atual) esconder(atual);
  cobrir(btnContacto, "#/contacto");
});
btnFechar.addEventListener("click", voltar);
btnFecharContacto.addEventListener("click", voltar);

/* =========================================================
   8. EVENTOS GERAIS E ARRANQUE
   ========================================================= */
construirContacto();
document.querySelectorAll("[data-t]").forEach(n => { n.textContent = CONFIG.textos[n.dataset.t]; });

document.addEventListener("click", () => atual && esconder(atual));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!obra.hidden || !painelLista.hidden || !painelContacto.hidden) voltar();
  else if (atual) esconder(atual);
});
let chaveJanela = window.innerWidth + "x" + window.innerHeight, tRedim = 0;
window.addEventListener("resize", () => {
  clearTimeout(tRedim);
  tRedim = setTimeout(() => {
    const k = window.innerWidth + "x" + window.innerHeight;
    if (k === chaveJanela || !listaAtual.length) return;
    chaveJanela = k;
    if (atual) esconder(atual);
    desenhar(listaAtual, true);   /* volta a arrumar a pilha para o novo tamanho */
  }, 180);
});

carregarEstrelas().then(lista => {
  ESTRELAS = lista;
  desenhar(lista.filter(e => !eSobre(e)));
  construirLista();
  carregado = true;
  rota();
});
</script>
